<svg
  width="830"
  height="400"
  viewBox="0 0 830 400"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b6ffb6"/>
      <stop offset="40%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="rgba(57,255,20,0)"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="black"/>

  <polygon
    points="415,40 591,360 239,360"
    fill="none"
    stroke="#39ff14"
    stroke-width="10"
    filter="url(#neonGlow)"
  />
  <circle
    cx="415"
    cy="230"
    r="60"
    fill="url(#greenGlow)"
  />
  <circle
    cx="415"
    cy="230"
    r="12"
    fill="#eaffea"
  />
</svg>
